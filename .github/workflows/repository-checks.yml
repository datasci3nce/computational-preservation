name: Evidence archive checks
on:
  push:
  pull_request:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen hashes, manifests and links
        run: python -m unittest discover -s tests -v
